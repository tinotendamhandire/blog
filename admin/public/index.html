<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>blog admin</title>
<style>
  @font-face {
    font-family: 'VT323';
    src: url('/admin/fonts/VT323-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --background: #050a05;
    --foreground: #33ff66;
    --card: #0b140b;
    --muted: #0c180d;
    --muted-foreground: #4f9f6a;
    --border: #1f4d2b;
    --destructive: #ff3355;
    --primary: #33ff66;
    --primary-foreground: #041006;
  }
  * { box-sizing: border-box; }
  html { font-size: 118%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--foreground);
    font-family: 'VT323', ui-monospace, monospace;
  }
  input, textarea, button {
    font-family: inherit;
    font-size: 1rem;
    background: var(--muted);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 0.5em 0.6em;
  }
  button {
    cursor: pointer;
    background: var(--primary);
    color: var(--primary-foreground);
    font-weight: 700;
  }
  button:hover { opacity: 0.85; }
  button.secondary { background: var(--muted); color: var(--foreground); }
  button.danger { background: var(--destructive); color: #200; }
  label { display: block; margin: 0.9em 0 0.25em; color: var(--muted-foreground); }
  a { color: var(--foreground); }

  #login {
    max-width: 24rem;
    margin: 15vh auto;
    padding: 1.5rem;
    border: 1px solid var(--border);
    background: var(--card);
    text-align: center;
  }
  #login input { width: 100%; margin-top: 1em; }
  #login button { width: 100%; margin-top: 1em; }
  #login .error { color: var(--destructive); margin-top: 0.75em; min-height: 1.2em; }

  #app { display: none; height: 100vh; }
  #app.visible { display: grid; grid-template-columns: 20rem 1fr; }

  #sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 1rem;
  }
  #sidebar h1 { font-size: 1.3rem; margin: 0 0 0.75rem; }
  #post-list { list-style: none; margin: 0; padding: 0; }
  #post-list li {
    border: 1px solid var(--border);
    margin-bottom: 0.4em;
    padding: 0.5em;
    cursor: pointer;
  }
  #post-list li:hover { background: var(--muted); }
  #post-list li.draft { color: var(--muted-foreground); }
  #post-list .date { display: block; font-size: 0.85em; color: var(--muted-foreground); }
  #post-list .tags { display: block; font-size: 0.8em; color: var(--primary); margin-top: 0.2em; }
  #post-filter { width: 100%; margin-bottom: 0.75em; }

  #editor { padding: 1.5rem; overflow-y: auto; }
  #editor input[type="text"], #editor input[type="date"] { width: 100%; }
  #editor textarea { width: 100%; min-height: 40vh; resize: vertical; }
  .row { display: flex; gap: 1rem; align-items: center; }
  .row > * { flex: 1; }
  .actions { margin-top: 1.5rem; display: flex; gap: 0.6em; }
  #upload-result { margin-top: 0.6em; word-break: break-all; }
  #status { margin-top: 0.6em; color: var(--muted-foreground); min-height: 1.2em; }

  #files-panel {
    margin: 0.5em 0 1em;
    max-height: 16rem;
    overflow-y: auto;
    border: 1px solid var(--border);
  }
  #files-list { list-style: none; margin: 0; padding: 0; }
  #files-list li {
    display: flex;
    align-items: center;
    gap: 0.6em;
    padding: 0.45em 0.6em;
    border-bottom: 1px solid var(--border);
    font-size: 0.85em;
  }
  #files-list li:last-child { border-bottom: none; }
  #files-list .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files-list .fmeta { color: var(--muted-foreground); white-space: nowrap; }
  #files-list button {
    padding: 0.2em 0.5em;
    font-size: 0.85em;
  }
  #files-empty { padding: 0.6em; color: var(--muted-foreground); font-size: 0.85em; }

  #mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 1rem;
  }
  #mode-toggle button {
    padding: 0.5em;
    background: var(--muted);
    color: var(--foreground);
    border: 0;
    font-size: 0.9rem;
  }
  #mode-toggle button[aria-pressed="true"] {
    background: var(--primary);
    color: var(--primary-foreground);
  }

  #album-list { list-style: none; margin: 0; padding: 0; }
  #album-list li {
    border: 1px solid var(--border);
    margin-bottom: 0.4em;
    padding: 0.5em;
    cursor: pointer;
  }
  #album-list li:hover { background: var(--muted); }
  #album-list .count { display: block; font-size: 0.85em; color: var(--muted-foreground); }

  #album-editor { padding: 1.5rem; overflow-y: auto; }
  #album-editor input[type="text"] { width: 100%; }

  #track-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.75em; }
  #track-table th, #track-table td {
    border: 1px solid var(--border);
    padding: 0.5em;
    text-align: left;
    vertical-align: top;
  }
  #track-table th { background: var(--muted); font-weight: 700; }
  #track-table input[type="text"], #track-table select {
    width: 100%;
    font-size: 0.9em;
    padding: 0.3em 0.4em;
  }
  #track-table .col-assets { min-width: 11rem; }
  #track-table .remove-track {
    background: var(--destructive);
    color: #200;
    padding: 0.3em 0.5em;
    font-size: 0.85em;
  }

  .asset-slot {
    display: inline-flex;
    align-items: center;
    gap: 0.3em;
    margin: 0.15em 0.3em 0.15em 0;
    padding: 0.2em 0.45em;
    border: 1px solid var(--border);
    font-size: 0.8em;
    background: var(--muted);
  }
  .asset-slot.filled { border-color: var(--primary); color: var(--primary); }
  .asset-slot a { color: inherit; text-decoration: none; }
  .asset-slot .remove-asset {
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    padding: 0;
    font: inherit;
    font-weight: 700;
  }
</style>
</head>
<body>

<div id="login">
  <div>&gt; blog admin_</div>
  <input id="secret-input" type="password" placeholder="shared secret" autocomplete="off" />
  <button id="login-btn">enter</button>
  <div class="error" id="login-error"></div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="mode-toggle">
      <button type="button" id="mode-posts-btn" aria-pressed="true">posts</button>
      <button type="button" id="mode-albums-btn" aria-pressed="false">albums</button>
    </div>

    <div id="posts-panel">
      <h1>posts</h1>
      <button id="new-btn" style="width:100%; margin-bottom:0.75em;">+ new post</button>
      <input type="text" id="post-filter" placeholder="filter by title or tag..." autocomplete="off" />
      <ul id="post-list"></ul>
    </div>

    <div id="albums-panel" style="display:none;">
      <h1>albums</h1>
      <button id="new-album-btn" style="width:100%; margin-bottom:0.75em;">+ new album</button>
      <ul id="album-list"></ul>
    </div>
  </div>
  <div id="editor">
    <label>slug (permanent — this is the only URL to the post)</label>
    <input type="text" id="f-slug" placeholder="my-post-slug" />

    <label>title</label>
    <input type="text" id="f-title" />

    <div class="row">
      <div>
        <label>date</label>
        <input type="date" id="f-date" />
      </div>
      <div>
        <label>tags (comma-separated)</label>
        <input type="text" id="f-tags" />
      </div>
      <div>
        <label><input type="checkbox" id="f-draft" style="width:auto;" /> draft (excluded from build)</label>
      </div>
    </div>

    <label>upload media</label>
    <input type="file" id="f-upload" />
    <div id="upload-result"></div>

    <label>
      <a href="#" id="files-toggle">files already uploaded &darr;</a>
    </label>
    <div id="files-panel" style="display:none;">
      <ul id="files-list"></ul>
    </div>

    <label>body (markdown/MDX — &lt;Media src="..." kind="video|audio" /&gt; for uploads, &lt;Tab tex="..." /&gt; or &lt;Tab src="..." /&gt; for a guitar pro / alphaTex embed — import Tab from '../../components/Tab.astro'; first)</label>
    <textarea id="f-body"></textarea>

    <div class="actions">
      <button id="save-btn">save</button>
      <button id="publish-btn" class="secondary">publish (commit + push)</button>
      <button id="delete-btn" class="danger" style="display:none;">delete</button>
      <button id="logout-btn" class="secondary">log out</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="album-editor" style="display:none;">
    <label>slug (permanent — this is the only URL to the album)</label>
    <input type="text" id="a-slug" placeholder="album-slug" />

    <label>title</label>
    <input type="text" id="a-title" />

    <table id="track-table">
      <thead>
        <tr>
          <th>title</th>
          <th>status</th>
          <th class="col-assets">assets</th>
          <th>notes</th>
          <th>linked posts</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="track-tbody"></tbody>
    </table>
    <button type="button" id="add-track-btn" style="margin-top:0.75em;">+ add track</button>

    <div class="actions">
      <button id="album-save-btn">save</button>
      <button id="album-publish-btn" class="secondary">publish (commit + push)</button>
      <button id="album-delete-btn" class="danger" style="display:none;">delete</button>
      <button id="album-logout-btn" class="secondary">log out</button>
    </div>
    <div id="album-status"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let secret = null;
  let currentSlug = null; // null = new post
  let allPosts = [];

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { ...(opts.headers || {}), Authorization: `Bearer ${secret}` },
    });
    if (res.status === 401) {
      logout();
      throw new Error('unauthorized');
    }
    return res;
  }

  function logout() {
    secret = null;
    localStorage.removeItem('adminSecret');
    $('app').classList.remove('visible');
    $('login').style.display = 'block';
  }

  async function tryLogin(value) {
    secret = value;
    const res = await api('/admin/api/posts');
    if (!res.ok) throw new Error('bad secret');
    localStorage.setItem('adminSecret', value);
    $('login').style.display = 'none';
    $('app').classList.add('visible');
    await loadPosts();
    clearEditor();
  }

  $('login-btn').addEventListener('click', async () => {
    $('login-error').textContent = '';
    try {
      await tryLogin($('secret-input').value);
    } catch {
      $('login-error').textContent = 'wrong secret, or something went wrong';
    }
  });
  $('secret-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('login-btn').click();
  });
  $('logout-btn').addEventListener('click', logout);

  async function loadPosts() {
    const res = await api('/admin/api/posts');
    allPosts = await res.json();
    renderPostList();
  }

  function renderPostList() {
    const query = $('post-filter').value.trim().toLowerCase();
    const posts = query
      ? allPosts.filter(
          (p) =>
            p.title.toLowerCase().includes(query) ||
            (p.tags || []).some((t) => t.toLowerCase().includes(query)),
        )
      : allPosts;

    const list = $('post-list');
    list.innerHTML = '';
    if (posts.length === 0) {
      list.innerHTML = '<li id="files-empty">no posts match</li>';
      return;
    }
    for (const p of posts) {
      const li = document.createElement('li');
      li.className = p.draft ? 'draft' : '';
      const tags = (p.tags || []).join(', ');
      li.innerHTML = `${p.title}<span class="date">${p.date}${p.draft ? ' · draft' : ''}</span>${tags ? `<span class="tags">${tags}</span>` : ''}`;
      li.addEventListener('click', () => loadPost(p.slug));
      list.appendChild(li);
    }
  }

  $('post-filter').addEventListener('input', renderPostList);

  function clearEditor() {
    currentSlug = null;
    $('f-slug').disabled = false;
    $('f-slug').value = '';
    $('f-title').value = '';
    $('f-date').value = new Date().toISOString().slice(0, 10);
    $('f-tags').value = '';
    $('f-draft').checked = false;
    $('f-body').value = '';
    $('delete-btn').style.display = 'none';
    $('status').textContent = '';
  }

  async function loadPost(slug) {
    const res = await api(`/admin/api/posts/${slug}`);
    if (!res.ok) return;
    const p = await res.json();
    currentSlug = slug;
    $('f-slug').value = p.slug;
    $('f-slug').disabled = true;
    $('f-title').value = p.title;
    $('f-date').value = p.date;
    $('f-tags').value = p.tags;
    $('f-draft').checked = p.draft;
    $('f-body').value = p.body;
    $('delete-btn').style.display = 'inline-block';
    $('status').textContent = '';
  }

  $('new-btn').addEventListener('click', clearEditor);

  async function doSave() {
    const slug = $('f-slug').value.trim();
    if (!/^[a-z0-9-]{1,80}$/.test(slug)) {
      $('status').textContent = 'slug must be lowercase letters, numbers, hyphens only';
      return null;
    }
    const payload = {
      title: $('f-title').value.trim(),
      date: $('f-date').value,
      draft: $('f-draft').checked,
      tags: $('f-tags').value,
      body: $('f-body').value,
    };
    const res = await api(`/admin/api/posts/${slug}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (res.ok) {
      $('status').textContent = 'saved (not published yet).';
      currentSlug = slug;
      $('f-slug').disabled = true;
      $('delete-btn').style.display = 'inline-block';
      await loadPosts();
      return slug;
    } else {
      $('status').textContent = `save failed: ${await res.text()}`;
      return null;
    }
  }

  $('save-btn').addEventListener('click', doSave);

  $('publish-btn').addEventListener('click', async () => {
    const slug = await doSave();
    if (!slug) return;
    $('status').textContent = 'publishing…';
    try {
      const res = await api(`/admin/api/publish/${slug}`, { method: 'POST' });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      $('status').textContent = data.published
        ? 'published — committed and pushed, deploy running now.'
        : 'nothing to publish (already up to date).';
    } catch (err) {
      $('status').textContent = `publish failed: ${err.message}`;
    }
  });

  $('delete-btn').addEventListener('click', async () => {
    if (!currentSlug) return;
    if (!confirm(`Delete "${currentSlug}"? This can't be undone here (though it's still in git history).`)) return;
    const res = await api(`/admin/api/posts/${currentSlug}`, { method: 'DELETE' });
    if (res.ok) {
      await loadPosts();
      clearEditor();
    }
  });

  function insertSnippet(url, contentType) {
    const kind = (contentType || '').startsWith('audio/') ? 'audio' : 'video';
    const snippet = `<Media src="${url}" kind="${kind}" />`;
    const ta = $('f-body');
    ta.value += (ta.value.endsWith('\n') || !ta.value ? '' : '\n\n') + snippet + '\n';
  }

  function humanSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    const units = ['KB', 'MB', 'GB'];
    let n = bytes / 1024;
    let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(1)} ${units[i]}`;
  }

  let filesLoaded = false;

  async function loadFiles() {
    const list = $('files-list');
    list.innerHTML = '<li id="files-empty">loading…</li>';
    try {
      const res = await api('/admin/api/files');
      if (!res.ok) throw new Error(await res.text());
      const files = await res.json();
      list.innerHTML = '';
      if (!files.length) {
        list.innerHTML = '<li id="files-empty">nothing uploaded yet</li>';
        return;
      }
      for (const f of files) {
        const li = document.createElement('li');
        const date = f.uploadedAt ? f.uploadedAt.slice(0, 10) : '';
        li.innerHTML = `
          <span class="fname" title="${f.originalName}">${f.originalName}</span>
          <span class="fmeta">${humanSize(f.size)} · ${date}</span>
        `;
        const insertBtn = document.createElement('button');
        insertBtn.textContent = 'insert';
        insertBtn.addEventListener('click', () => insertSnippet(f.url, f.contentType));
        const copyBtn = document.createElement('button');
        copyBtn.className = 'secondary';
        copyBtn.textContent = 'copy';
        copyBtn.addEventListener('click', () => navigator.clipboard.writeText(f.url));
        const delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.textContent = 'delete';
        delBtn.addEventListener('click', async () => {
          if (!confirm(`Delete "${f.originalName}"? Any post still linking to it will break.`)) return;
          const dres = await api(`/admin/api/files/${f.id}`, { method: 'DELETE' });
          if (dres.ok) await loadFiles();
        });
        li.append(insertBtn, copyBtn, delBtn);
        list.appendChild(li);
      }
    } catch (err) {
      list.innerHTML = `<li id="files-empty">failed to load: ${err.message}</li>`;
    }
  }

  $('files-toggle').addEventListener('click', async (e) => {
    e.preventDefault();
    const panel = $('files-panel');
    const show = panel.style.display === 'none';
    panel.style.display = show ? 'block' : 'none';
    if (show && !filesLoaded) {
      filesLoaded = true;
      await loadFiles();
    }
  });

  $('f-upload').addEventListener('change', async () => {
    const file = $('f-upload').files[0];
    if (!file) return;
    $('upload-result').textContent = 'uploading…';
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await api('/admin/api/upload', { method: 'POST', body: fd });
      if (!res.ok) throw new Error(await res.text());
      const { url } = await res.json();
      $('upload-result').innerHTML = `${url} — <a href="#" id="insert-link">insert into body</a>`;
      $('insert-link').addEventListener('click', (e) => {
        e.preventDefault();
        insertSnippet(url, file.type);
      });
      if (filesLoaded) await loadFiles();
    } catch (err) {
      $('upload-result').textContent = `upload failed: ${err.message}`;
    }
  });

  // ── Albums / track tracker ──────────────────────────────────────────

  const ASSET_TYPES = ['stems', 'artwork', 'lyrics', 'tab', 'sheet'];
  let mode = 'posts'; // 'posts' | 'albums'
  let allAlbums = [];
  let albumsLoaded = false;
  let currentAlbumSlug = null; // null = new album
  let currentTracks = [];

  function setMode(next) {
    mode = next;
    $('mode-posts-btn').setAttribute('aria-pressed', String(mode === 'posts'));
    $('mode-albums-btn').setAttribute('aria-pressed', String(mode === 'albums'));
    $('posts-panel').style.display = mode === 'posts' ? 'block' : 'none';
    $('albums-panel').style.display = mode === 'albums' ? 'block' : 'none';
    $('editor').style.display = mode === 'posts' ? 'block' : 'none';
    $('album-editor').style.display = mode === 'albums' ? 'block' : 'none';
    if (mode === 'albums' && !albumsLoaded) {
      albumsLoaded = true;
      loadAlbums();
    }
  }
  $('mode-posts-btn').addEventListener('click', () => setMode('posts'));
  $('mode-albums-btn').addEventListener('click', () => setMode('albums'));
  $('album-logout-btn').addEventListener('click', logout);

  async function loadAlbums() {
    const res = await api('/admin/api/albums');
    allAlbums = await res.json();
    renderAlbumList();
  }

  function renderAlbumList() {
    const list = $('album-list');
    list.innerHTML = '';
    if (allAlbums.length === 0) {
      list.innerHTML = '<li id="files-empty">no albums yet</li>';
      return;
    }
    for (const a of allAlbums) {
      const li = document.createElement('li');
      li.innerHTML = `${a.title}<span class="count">${a.trackCount} track${a.trackCount === 1 ? '' : 's'}</span>`;
      li.addEventListener('click', () => loadAlbum(a.slug));
      list.appendChild(li);
    }
  }

  function clearAlbumEditor() {
    currentAlbumSlug = null;
    currentTracks = [];
    $('a-slug').disabled = false;
    $('a-slug').value = '';
    $('a-title').value = '';
    $('album-delete-btn').style.display = 'none';
    $('album-status').textContent = '';
    renderTrackTable();
  }

  $('new-album-btn').addEventListener('click', clearAlbumEditor);

  async function loadAlbum(slug) {
    const res = await api(`/admin/api/albums/${slug}`);
    if (!res.ok) return;
    const a = await res.json();
    currentAlbumSlug = slug;
    currentTracks = a.tracks || [];
    $('a-slug').value = a.slug;
    $('a-slug').disabled = true;
    $('a-title').value = a.title;
    $('album-delete-btn').style.display = 'inline-block';
    $('album-status').textContent = '';
    renderTrackTable();
  }

  function newTrack() {
    return { id: Math.random().toString(36).slice(2, 10), title: '', status: 'idea', assets: {}, notes: '', linkedPosts: [] };
  }

  $('add-track-btn').addEventListener('click', () => {
    currentTracks.push(newTrack());
    renderTrackTable();
  });

  function renderTrackTable() {
    const tbody = $('track-tbody');
    tbody.innerHTML = '';
    currentTracks.forEach((track, index) => {
      const tr = document.createElement('tr');

      const titleTd = document.createElement('td');
      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.value = track.title || '';
      titleInput.addEventListener('input', (e) => { track.title = e.target.value; });
      titleTd.appendChild(titleInput);

      const statusTd = document.createElement('td');
      const statusSelect = document.createElement('select');
      for (const s of ['idea', 'tracking', 'mixing', 'mastering', 'done']) {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        if (track.status === s) opt.selected = true;
        statusSelect.appendChild(opt);
      }
      statusSelect.addEventListener('change', (e) => { track.status = e.target.value; });
      statusTd.appendChild(statusSelect);

      const assetsTd = document.createElement('td');
      assetsTd.className = 'col-assets';
      for (const type of ASSET_TYPES) {
        const slot = document.createElement('span');
        const asset = track.assets && track.assets[type];
        if (asset) {
          slot.className = 'asset-slot filled';
          const a = document.createElement('a');
          a.href = asset.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = type;
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'remove-asset';
          removeBtn.textContent = '×';
          removeBtn.addEventListener('click', () => {
            delete track.assets[type];
            renderTrackTable();
          });
          slot.append(a, removeBtn);
        } else {
          slot.className = 'asset-slot';
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'remove-asset';
          btn.textContent = `+ ${type}`;
          btn.addEventListener('click', () => uploadTrackAsset(track, type));
          slot.appendChild(btn);
        }
        assetsTd.appendChild(slot);
      }

      const notesTd = document.createElement('td');
      const notesInput = document.createElement('input');
      notesInput.type = 'text';
      notesInput.value = track.notes || '';
      notesInput.placeholder = 'needs: ...';
      notesInput.addEventListener('input', (e) => { track.notes = e.target.value; });
      notesTd.appendChild(notesInput);

      const linkedTd = document.createElement('td');
      const linkedInput = document.createElement('input');
      linkedInput.type = 'text';
      linkedInput.value = (track.linkedPosts || []).join(', ');
      linkedInput.placeholder = 'post-slug, post-slug';
      linkedInput.addEventListener('input', (e) => {
        track.linkedPosts = e.target.value.split(',').map((s) => s.trim()).filter(Boolean);
      });
      linkedTd.appendChild(linkedInput);

      const removeTd = document.createElement('td');
      const removeTrackBtn = document.createElement('button');
      removeTrackBtn.type = 'button';
      removeTrackBtn.className = 'remove-track';
      removeTrackBtn.textContent = 'remove';
      removeTrackBtn.addEventListener('click', () => {
        currentTracks.splice(index, 1);
        renderTrackTable();
      });
      removeTd.appendChild(removeTrackBtn);

      tr.append(titleTd, statusTd, assetsTd, notesTd, linkedTd, removeTd);
      tbody.appendChild(tr);
    });
  }

  async function uploadTrackAsset(track, type) {
    const input = document.createElement('input');
    input.type = 'file';
    input.addEventListener('change', async () => {
      const file = input.files[0];
      if (!file) return;
      $('album-status').textContent = `uploading ${type}…`;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await api('/admin/api/upload', { method: 'POST', body: fd });
        if (!res.ok) throw new Error(await res.text());
        const { url } = await res.json();
        track.assets = track.assets || {};
        track.assets[type] = { url, originalName: file.name };
        $('album-status').textContent = '';
        renderTrackTable();
      } catch (err) {
        $('album-status').textContent = `upload failed: ${err.message}`;
      }
    });
    input.click();
  }

  async function doSaveAlbum() {
    const slug = $('a-slug').value.trim();
    if (!/^[a-z0-9-]{1,80}$/.test(slug)) {
      $('album-status').textContent = 'slug must be lowercase letters, numbers, hyphens only';
      return null;
    }
    const payload = { title: $('a-title').value.trim(), tracks: currentTracks };
    const res = await api(`/admin/api/albums/${slug}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (res.ok) {
      $('album-status').textContent = 'saved (not published yet).';
      currentAlbumSlug = slug;
      $('a-slug').disabled = true;
      $('album-delete-btn').style.display = 'inline-block';
      await loadAlbums();
      return slug;
    } else {
      $('album-status').textContent = `save failed: ${await res.text()}`;
      return null;
    }
  }

  $('album-save-btn').addEventListener('click', doSaveAlbum);

  $('album-publish-btn').addEventListener('click', async () => {
    const slug = await doSaveAlbum();
    if (!slug) return;
    $('album-status').textContent = 'publishing…';
    try {
      const res = await api(`/admin/api/albums/${slug}/publish`, { method: 'POST' });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      $('album-status').textContent = data.published
        ? 'published — committed and pushed, deploy running now.'
        : 'nothing to publish (already up to date).';
    } catch (err) {
      $('album-status').textContent = `publish failed: ${err.message}`;
    }
  });

  $('album-delete-btn').addEventListener('click', async () => {
    if (!currentAlbumSlug) return;
    if (!confirm(`Delete album "${currentAlbumSlug}"? This can't be undone here (though it's still in git history once published).`)) return;
    const res = await api(`/admin/api/albums/${currentAlbumSlug}`, { method: 'DELETE' });
    if (res.ok) {
      await loadAlbums();
      clearAlbumEditor();
    }
  });

  // Resume session if a secret is already remembered on this device.
  const remembered = localStorage.getItem('adminSecret');
  if (remembered) {
    tryLogin(remembered).catch(() => {
      $('login').style.display = 'block';
    });
  }
</script>
</body>
</html>
