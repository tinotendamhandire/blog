# blog + file-host + admin for blog.tinotenda.xyz. All three are containers
# on this box — no Cloudflare Pages. cloudflared's tunnel ingress needs a
# private origin to point at, and a public *.pages.dev address doesn't
# qualify (that's the "DNS points to prohibited IP" error), so the static
# build is served locally too, same as the other two.
#
# Run standalone from this directory (`docker compose up -d --build`), or
# copy these three `services:` entries into the box's existing compose file
# alongside tinotools-app/convertx/metube/crafty — either works, they don't
# collide with anything as long as the ports below stay free.
#
# Ports are bound to 127.0.0.1 only: nothing here is meant to be reachable
# except through the cloudflared tunnel already running on the box (see
# DEPLOY.md for the tunnel ingress rules) or from other containers on this
# compose network.

services:
  blog:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"

  file-host:
    build: ./file-host
    restart: unless-stopped
    environment:
      UPLOAD_SECRET: ${UPLOAD_SECRET}
      PUBLIC_BASE_URL: https://blog.tinotenda.xyz
    volumes:
      - file-host-data:/app/data
    ports:
      - "127.0.0.1:3401:3000"

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on:
      - file-host
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET}
      FILE_HOST_URL: http://file-host:3000
      FILE_HOST_UPLOAD_SECRET: ${UPLOAD_SECRET}
    volumes:
      # bind mount, not a named volume — this needs to be the actual
      # checkout's content directory so what admin writes is what you
      # `git add` and push, not content trapped inside a docker volume.
      - ./src/content/notes:/app/content
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  file-host-data:
