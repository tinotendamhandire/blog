# blog + file-host + admin for blog.tinotenda.xyz. All three are containers
# on this box — no Cloudflare Pages. cloudflared's tunnel ingress needs a
# private origin to point at, and a public *.pages.dev address doesn't
# qualify (that's the "DNS points to prohibited IP" error), so the static
# build is served locally too, same as the other two.
#
# Run standalone from this directory (`docker compose up -d --build`), or
# copy these three `services:` entries into the box's existing compose file
# alongside tinotools-app/convertx/metube/crafty — either works, they don't
# collide with anything as long as the ports below stay free.
#
# Ports publish on all interfaces (0.0.0.0), matching tinotools/convertx/
# etc. — cloudflared runs on a different machine on the LAN and reaches
# these by IP (192.168.4.199:<port>), so localhost-only binding isn't an
# option here. Same trust model as the rest of the box: reachable on the
# LAN, not exposed beyond it, actual public entry is only ever through the
# tunnel (see DEPLOY.md for the ingress rules).

services:
  blog:
    # Built from a clean git-HEAD export (see scripts/prepare-blog-context.sh),
    # not this directory directly — the live checkout has admin's uncommitted
    # writes sitting in src/content/notes, and those shouldn't reach the site
    # just because some other push triggered a rebuild. Run the script before
    # `up --build`; the deploy workflow does this automatically.
    build: ./.deploy-context
    restart: unless-stopped
    ports:
      - "8090:8080"

  file-host:
    build: ./file-host
    restart: unless-stopped
    environment:
      UPLOAD_SECRET: ${UPLOAD_SECRET}
      PUBLIC_BASE_URL: https://blog.tinotenda.xyz
    volumes:
      - file-host-data:/app/data
    ports:
      - "3401:3000"

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on:
      - file-host
    # Runs as the host user, not the image's default root — Publish writes
    # git objects and content files into the bind-mounted repo, and if
    # those land owned by root, the self-hosted deploy runner (which runs
    # as a normal user) loses write access to its own checkout on the very
    # next `git pull`. Confirm these match your box with `id -u`/`id -g`.
    user: "${ADMIN_UID:-1000}:${ADMIN_GID:-1000}"
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET}
      FILE_HOST_URL: http://file-host:3000
      FILE_HOST_UPLOAD_SECRET: ${UPLOAD_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      # the whole repo, not just the content dir — the Publish button runs
      # git add/commit/push against it, which needs .git to be reachable
      - .:/app/repo
    ports:
      - "3100:3100"

volumes:
  file-host-data:
