server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Belt-and-suspenders alongside the per-page <meta robots> and
    # robots.txt already baked into the static output.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
