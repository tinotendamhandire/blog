server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx sits behind the tunnel and only ever sees plain http on 8080 —
    # without this, its automatic trailing-slash redirect (try_files'
    # `$uri/` match) builds an absolute URL from what IT sees, not what the
    # visitor's browser actually used, producing
    # http://blog.tinotenda.xyz:8080/... instead of the real https:// URL.
    # A relative redirect sidesteps the scheme/host/port guess entirely.
    absolute_redirect off;

    # Belt-and-suspenders alongside the per-page <meta robots> and
    # robots.txt already baked into the static output.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
